name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - develop
      - 'release/**'
  schedule:
    - cron: '0 0 * * *'

permissions: { }

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  setup:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    if: ${{ !contains(github.event.pull_request.title, '[skip ci]') && !contains(github.event.pull_request.body, '[skip ci]') }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0

      - name: Check PR Size
        if: ${{ !contains(github.event.pull_request.title, '[skip size]') && !contains(github.event.pull_request.body, '[skip size]') }}
        env:
          GIT_BRANCH: ${{ github.head_ref || github.ref_name }}
          GIT_BRANCH_DEST: ${{ github.base_ref || '' }}
        run: |
          chmod +x ./scripts/check_pr_size.sh
          ./scripts/check_pr_size.sh

  lint-check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    needs: setup
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Set up JDK 17
        uses: actions/setup-java@ad2b38190b15e4d6bdf0c97fb4fca8412226d287
        with:
          distribution: 'zulu'
          java-version: '17'
          cache: 'gradle'

      - name: Lint Check
        run: ./gradlew ktlintCheck

  unit-tests:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    needs: lint-check
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Set up JDK 17
        uses: actions/setup-java@ad2b38190b15e4d6bdf0c97fb4fca8412226d287
        with:
          distribution: 'zulu'
          java-version: '17'
          cache: 'gradle'

      - name: Unit Tests
        if: ${{ !contains(github.event.pull_request.title, '[skip unitTest]') && !contains(github.event.pull_request.body, '[skip unitTest]') }}
        run: ./gradlew testDebugUnitTest testDhis2DebugUnitTest testAndroidHostTest jacocoReport --stacktrace --no-daemon

      # The raw execution data, so code-quality can merge it with the instrumented
      # coverage that comes back from BrowserStack and regenerate the XML.
      - name: Upload JaCoCo execution data
        if: ${{ !contains(github.event.pull_request.title, '[skip unitTest]') && !contains(github.event.pull_request.body, '[skip unitTest]') }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: jacoco-exec
          path: '**/build/jacoco/*.exec'
          if-no-files-found: warn
          retention-days: 7

      - name: Upload JaCoCo Report
        if: ${{ !contains(github.event.pull_request.title, '[skip unitTest]') && !contains(github.event.pull_request.body, '[skip unitTest]') }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: jacoco-report
          path: '**/build/coverage-report/**'
          if-no-files-found: warn
          retention-days: 7

  build-test-apks:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    needs: [ unit-tests, lint-check ]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Set up JDK 17
        uses: actions/setup-java@ad2b38190b15e4d6bdf0c97fb4fca8412226d287
        with:
          distribution: 'zulu'
          java-version: '17'
          cache: 'gradle'

      - name: Build Test APKs
        run: |
          ./gradlew :app:assembleDhis2Debug \
            :app:assembleDhis2DebugAndroidTest \
            :app:compileDhis2PlayServicesDebugKotlin \
            :app:compileDhis2TrainingDebugKotlin \
            --no-daemon

      - name: Upload APKs
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: test-apks
          path: |
            app/build/outputs/apk/**/*.apk
          retention-days: 1

  run-ui-portrait:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    needs: build-test-apks
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      # upload-artifact strips the common ancestor of the uploaded paths, so with a single
      # app/build/outputs/apk/**/*.apk path the archive is rooted at app/build/outputs/apk.
      # Download into that same directory to restore the layout the find commands below expect.
      - name: Download APKs
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: test-apks
          path: app/build/outputs/apk

      - name: Run UI Tests in Portrait
        env:
          BROWSERSTACK_USR: ${{ secrets.BROWSERSTACK_USERNAME }}
          BROWSERSTACK_PSW: ${{ secrets.BROWSERSTACK_PASSWORD }}
          buildTag: ${{ github.head_ref || github.ref_name }}
        run: |
          app_apk=$(find app/build/outputs/apk/dhis2/debug -iname "*.apk")
          test_apk=$(find app/build/outputs/apk/androidTest -iname "*.apk")
          export app_apk_path="${GITHUB_WORKSPACE}/${app_apk}"
          export test_apk_path="${GITHUB_WORKSPACE}/${test_apk}"
          cd scripts
          chmod +x browserstackJenkins.sh
          ./browserstackJenkins.sh

      - name: Upload BrowserStack coverage
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: browserstack-coverage-portrait
          path: browserstack-coverage/**
          if-no-files-found: warn
          retention-days: 7

  run-ui-landscape:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    needs: build-test-apks
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      # upload-artifact strips the common ancestor of the uploaded paths, so with a single
      # app/build/outputs/apk/**/*.apk path the archive is rooted at app/build/outputs/apk.
      # Download into that same directory to restore the layout the find commands below expect.
      - name: Download APKs
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: test-apks
          path: app/build/outputs/apk

      - name: Run UI Tests in Landscape
        env:
          BROWSERSTACK_USR: ${{ secrets.BROWSERSTACK_USERNAME }}
          BROWSERSTACK_PSW: ${{ secrets.BROWSERSTACK_PASSWORD }}
          buildTag: ${{ github.head_ref || github.ref_name }}
        run: |
          app_apk=$(find app/build/outputs/apk/dhis2/debug -iname "*.apk")
          test_apk=$(find app/build/outputs/apk/androidTest -iname "*.apk")
          export app_apk_path="${GITHUB_WORKSPACE}/${app_apk}"
          export test_apk_path="${GITHUB_WORKSPACE}/${test_apk}"
          cd scripts
          chmod +x browserstackJenkinsLandscape.sh
          ./browserstackJenkinsLandscape.sh

      - name: Upload BrowserStack coverage
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: browserstack-coverage-landscape
          path: browserstack-coverage/**
          if-no-files-found: warn
          retention-days: 7

  code-quality:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    # Waits on the BrowserStack jobs so their instrumented coverage is merged in before
    # the analysis. It costs turnaround time on the Sonar result.
    needs: [ unit-tests, run-ui-portrait, run-ui-landscape ]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@ad2b38190b15e4d6bdf0c97fb4fca8412226d287
        with:
          distribution: 'zulu'
          java-version: '17'
          cache: 'gradle'

      - name: Download JaCoCo execution data
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: jacoco-exec
          path: .

      - name: Download BrowserStack coverage
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          pattern: browserstack-coverage-*
          path: browserstack-coverage
          merge-multiple: true
        continue-on-error: true

      # One .ec covers the whole app process, so every module that reports coverage needs
      # a copy; jacocoReport ignores classes outside its own classDirectories. The count is
      # logged so an empty result is visible rather than silently unit-tests-only.
      - name: Stage instrumented coverage
        run: |
          ec_count=$(find browserstack-coverage -name '*.ec' 2>/dev/null | wc -l | tr -d ' ')
          echo "instrumented coverage files retrieved: $ec_count"
          if [ "$ec_count" -gt 0 ]; then
            for module in app commons compose-table stock-usecase \
                          dhis_android_analytics dhis2_android_maps dhis2-mobile-program-rules; do
              mkdir -p "$module/build/outputs/code_coverage/browserstack"
              find browserstack-coverage -name '*.ec' -exec cp {} "$module/build/outputs/code_coverage/browserstack/" \;
            done
          else
            echo "No instrumented coverage retrieved; the report will cover unit tests only."
          fi

      - name: Merge coverage
        run: ./gradlew jacocoReport -x testDebugUnitTest -x testDhis2DebugUnitTest --stacktrace --no-daemon

      - name: SonarQube
        env:
          GIT_BRANCH: ${{ github.head_ref || github.ref_name }}
          GIT_BRANCH_DEST: ${{ github.base_ref || '' }}
          PULL_REQUEST: ${{ github.event.pull_request.number }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          chmod +x ./scripts/sonarqube.sh
          ./scripts/sonarqube.sh

  notification:
    runs-on: ubuntu-latest
    needs: [ setup, lint-check, unit-tests, build-test-apks, run-ui-portrait, run-ui-landscape, code-quality ]
    if: always() && github.event_name != 'pull_request'
    steps:
      - name: Notify Slack on Success
        if: ${{ !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled') }}
        uses: slackapi/slack-github-action@dcb1066f776dd043e64d0e8ba94ca15cc7e1875d # v4.0.0
        with:
          webhook: ${{ secrets.SLACK_WEBHOOK_URL }}
          webhook-type: incoming-webhook
          payload: |
            {
              "channel": "#android-capture-app-ci",
              "attachments": [{
                "color": "good",
                "text": "*Build Succeeded*\n*Job:* ${{ github.workflow }}\n*Branch:* ${{ github.ref_name }}\n*Build Number:* ${{ github.run_number }} (<${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|Open>)"
              }]
            }

      - name: Notify Slack on Failure
        if: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}
        uses: slackapi/slack-github-action@dcb1066f776dd043e64d0e8ba94ca15cc7e1875d # v4.0.0
        with:
          webhook: ${{ secrets.SLACK_WEBHOOK_URL }}
          webhook-type: incoming-webhook
          payload: |
            {
              "channel": "#android-capture-app-ci",
              "attachments": [{
                "color": "danger",
                "text": "*Build Failed*\n*Job:* ${{ github.workflow }}\n*Branch:* ${{ github.ref_name }}\n*Build Number:* ${{ github.run_number }} (<${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|Open>)"
              }]
            }
